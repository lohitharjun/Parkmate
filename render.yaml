# Render Blueprint: New + > Blueprint, pick the repo. Secrets are entered in the dashboard (sync: false), never committed.
services:
  - type: web
    name: parkmate-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DB_SSL
        value: "true"
