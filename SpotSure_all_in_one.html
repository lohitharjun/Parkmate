const pages = {"index": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>SpotSure — Simple Parking Booking<\/title>\n<meta name=\"description\" content=\"Find and book nearby parking with SpotSure.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  --paper:#f3efe6; --card:#fffdf8; --ink:#101a33; --ink2:#46506b; --line:#d9d2c1;\n  --hold:#f2a900; --holdbg:#fff3d1; --ok:#14935f; --okbg:#dcf5e9;\n  --rescue:#e5502b; --rescuebg:#ffe5dd; --info:#2358d6; --infobg:#e2ebff; --grey:#7b8196; --greybg:#ececf0;\n  --r:16px;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml{scroll-behavior:smooth}\nbody{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;font-size:16px}\n.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}\na{color:inherit}\n.wrap{max-width:1180px;margin:0 auto;padding:0 20px}\nsection{padding:72px 0}\n.lane{height:6px;background:repeating-linear-gradient(90deg,var(--hold) 0 28px,transparent 28px 48px);opacity:.9}\nh1,h2,h3{line-height:1.12;letter-spacing:-.02em}\nh2{font-size:clamp(28px,4vw,42px);margin-bottom:10px}\nh3{font-size:19px}\n.kicker{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--info);margin-bottom:10px;display:block}\n.lead{color:var(--ink2);max-width:760px;font-size:18px;margin-bottom:34px}\n\n/* nav */\nnav.top{position:sticky;top:0;z-index:50;background:rgba(243,239,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}\nnav.top .wrap{display:flex;align-items:center;gap:18px;height:58px;overflow-x:auto;white-space:nowrap}\n.brand{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:non %)}\n.ticket:before{left:-13px}.ticket:after{right:-13px}\n.ticket .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1.5px dashed rgba(255,255,255,.25);font-size:15px}\n.ticket .row:last-child{border:0}\n.ticket small{font-family:'IBM Plex Mono';opacity:.65;letter-spacing:.1em;font-size:11px;text-transform:uppercase}\n.timer-demo{font-family:'IBM Plex Mono';font-size:34px;color:var(--hold);font-weight:600}\n\n/* chips */\n.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px 'IBM Plex Mono',monospace;padding:4px 10px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}\n.chip:before{content:\"\";width:8px;height:8px;border-radius:50%;background:currentColor}\n.c-ok{color:var(--ok);background:var(--okbg)}\n.c-hold{color:#9a6a00;background:var(--holdbg)}\n.c-rescue{color:var(--rescue);background:var(--rescuebg)}\n.c-info{color:var(--info);background:var(--infobg)}\n.c-grey{color:var(--grey);background:var(--greybg)}\n.pulse:before{animation:pl 1.1s infinite}\n@keyframes pl{50%{opacity:.2;transform:scale(1.5)}}\n\n/* journey */\n.journey{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}\n.step{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;position:relative;counter-increment:s}\n.step:before{content:counter(s);position:absolute;top:-14px;left:16px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 14px 'IBM Plex Mono'}\n.step.sys{background:#eef1fb}\n.step.fail{background:var(--rescuebg);border-color:#f2b9a8}\n.step h3{margin:8px 0 6px;font-size:17px}\n.step p{font-size:14px;color:var(--ink2)}\n.step .tag{display:inline-block;margin-top:10px;font:500 11px 'IBM Plex Mono';letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}\n.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:22px;font-size:14px;color:var(--ink2)}\n.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:1.5px solid var(--line)}\n\n/* screens */\n.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}\n.fbtn{border:1.5px solid var(--ink);background:transparent;padding:7px 14px;border-radius:999px;font:500 14px 'Space Grotesk';cursor:pointer}\n.fbtn.on{background:var(--ink);color:#fff}\n.screens{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.scard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}\n.scard header{display:flex;justify-content:space-between;align-items:center}\n.sid{font:600 12px 'IBM Plex Mono';background:var(--ink);color:#fff;padding:3px 9px;border-radius:7px}\n.sid.p{background:var(--info)}\n.scard p.why{font-size:14px;color:var(--ink2)}\n.scard h4{font:600 11px 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-top:4px}\n.scard ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px}\n.scard li{font-size:13px;background:var(--paper);border:1px solid var(--line);padding:3px 9px;border-radius:8px}\n.scard li.b{background:var(--ink);color:#fff;border-color:var(--ink)}\n.scard li.m{background:var(--holdbg);border-color:#ecd391}\n.scard .go{margin-top:auto;font:500 12px 'IBM Plex Mono';color:var(--info)}\n.scard.hide{display:none}\n\n/* nav diagram */\n.diagram{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}\n.diagram svg{min-width:900px;width:100%;height:auto;display:block}\n.diagram text{font-family:'Space Grotesk',sans-serif}\n.nbox{fill:#fff;stroke:#101a33;stroke-width:2}\n.nbox.sys{fill:#eef1fb}.nbox.res{fill:#ffe5dd;stroke:#e5502b}.nbox.pro{fill:#e2ebff;stroke:#2358d6}.nbox.ok{fill:#dcf5e9;stroke:#14935f}\n.nt{font-size:14px;font-weight:600;fill:#101a33}.ns{font-size:11px;fill:#46506b}\n.arr{stroke:#101a33;stroke-width:2;fill:none;marker-end:url(#a)}\n.arr.f{stroke:#e5502b;marker-end:url(#af);stroke-dasharray:6 5}\n.arr.g{stroke:#14935f;marker-end:url(#ag)}\n.al{font-size:11px;font-family:'IBM Plex Mono',monospace;fill:#46506b}\n.nav-notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}\n.note{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;font-size:14px;color:var(--ink2)}\n.note b{color:var(--ink);display:block;margin-bottom:4px}\n\n/* prototype */\n.proto{display:grid;grid-template-columns:300px 390px 1fr;gap:28px;align-items:start}\n.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px}\n.panel h3{font-size:16px;margin-bottom:10px}\n.scn label{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14px}\n.scn label:has(input:checked){border-color:var(--ink);background:var(--paper)}\n.scn input{margin-top:4px;accent-color:var(--ink)}\n.scn small{display:block;color:var(--ink2);font-size:12px}\n.tracker{list-style:none;margin-top:6px}\n.tracker li{display:flex;gap:10px;font-size:13px;padding:6px 0;color:var(--grey);align-items:flex-start}\n.tracker li b{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px 'IBM Plex Mono'}\n.tracker li.done{color:var(--ink)}.tracker li.done b{background:var(--ok);border-color:var(--ok);color:#fff}\n.tracker li.now{color:var(--ink);font-weight:600}.tracker li.now b{background:var(--hold);border-color:var(--hold)}\n.phone{width:380px;max-width:100%;height:700px;border-radius:42px;background:#0b1228;padding:12px;box-shadow:0 30px 50px -25px rgba(16,26,51,.6);position:relative}\n.phone .screen{background:var(--paper);height:100%;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;position:relative}\n.notch{width:110px;height:22px;background:#0b1228;border-radius:0 0 14px 14px;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5}\n.appbar{padding:34px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--card)}\n.appbar b{font-size:16px;flex:1}\n.back{background:none;border:0;font-size:20px;cursor:pointer;width:28px}\n.scr{display:none;flex:1;overflow-y:auto;padding:16px 18px 20px;animation:in .25s}\n.scr.on{display:block}\n@keyframes in{from{opacity:0;transform:translateY(8px)}}\n.field{margin-bottom:12px}\n.field label{display:block;font:500 11px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}\n.field input,.field select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font:500 15px 'Space Grotesk';color:var(--ink)}\n.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.full{width:100%;justify-content:center}\n.lcard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;cursor:pointer;transition:.15s}\n.lcard:hover{border-color:var(--ink);transform:translateY(-2px)}\n.lcard .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}\n.lcard b{font-size:15px}\n.lcard .m{font-size:13px;color:var(--ink2);margin-top:4px;display:flex;justify-content:space-between;gap:8px}\n.meter{height:7px;border-radius:99px;background:var(--greybg);overflow:hidden;margin:8px 0 2px}\n.meter i{display:block;height:100%;border-radius:99px}\n.meter.high i{background:var(--ok)}.meter.med i{background:var(--hold)}.meter.low i{background:var(--rescue)}\n.mapph{height:110px;border-radius:14px;background:\n repeating-linear-gradient(0deg,transparent 0 22px,#ddd5c3 22px 24px),repeating-linear-gradient(90deg,transparent 0 30px,#ddd5c3 30px 32px),#ebe5d6;position:relative;margin-bottom:12px}\n.mapph:after{content:\"P\";position:absolute;left:50%;top:50%;transform:translate(-50%,-60%);width:34px;height:34px;border-radius:50% 50% 50% 0;rotate:-45deg;background:var(--info);color:#fff;display:grid;place-items:center;font-weight:700}\n.kv{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}\n.kv span:first-child{color:var(--ink2)}\n.ev{margin:10px 0;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px}\n.ev h5{font:600 11px 'IBM Plex Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}\n.ev div{font-size:13px;padding:4px 0;display:flex;gap:8px}\n.ev .ok:before{content:\"✓\";color:var(--ok);font-weight:700}.ev .wn:before{content:\"!\";color:#b07a00;font-weight:700}.ev .no:before{content:\"✕\";color:var(--rescue);font-weight:700}\n.banner{border-radius:12px;padding:11px 13px;font-size:14px;margin-bottom:12px;display:flex;gap:10px}\n.banner.hold{background:var(--holdbg);border:1.5px solid #ecd391}\n.banner.bad{background:var(--rescuebg);border:1.5px solid #f2b9a8}\n.banner.good{background:var(--okbg);border:1.5px solid #a8e0c6}\n.banner.info{background:var(--infobg);border:1.5px solid #b6c9f5}\n.clock{text-align:center;padding:18px 0 8px}\n.clock .big{font:600 56px 'IBM Plex Mono';letter-spacing:-.03em}\n.clock .big.low{color:var(--rescue);animation:pl 1s infinite}\n.bar{height:9px;background:var(--greybg);border-radius:99px;overflow:hidden;margin:6px 0 14px}\n.bar i{display:block;height:100%;background:var(--hold);width:100%;transition:width 1s linear}\n.spin{width:44px;height:44px;border:5px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:34px auto 14px;animation:sp .8s linear infinite}\n@keyframes sp{to{rotate:360deg}}\n.center{text-align:center}\n.ref{font:600 20px 'IBM Plex Mono';letter-spacing:.1em;background:var(--ink);color:#fff;border-radius:12px;padding:10px;text-align:center;margin:12px 0}\n.delta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}\n.delta span{font:500 11px 'IBM Plex Mono';padding:2px 7px;border-radius:6px;background:var(--paper);border:1px solid var(--line)}\n.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}\n.toast{position:absolute;left:14px;right:14px;bottom:14px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:14px;font-size:14px;transform:translateY(140%);transition:.3s;z-index:9}\n.toast.show{transform:none}\n.logbox{font:12px/1.5 'IBM Plex Mono',monospace;background:#0b1228;color:#b7c2e6;border-radius:12px;padding:12px;height:230px;overflow:auto}\n.logbox p{margin-bottom:5px}.logbox .u{color:#fff}.logbox .s{color:#8fb3ff}.logbox .e{color:#ff9d84}.logbox .g{color:#7be3b5}\n\n/* tables */\n.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}\n.tbl th{background:var(--ink);color:#fff;text-align:left;font:500 12px 'IBM Plex Mono';letter-spacing:.08em;text-transform:uppercase;padding:12px 14px}\n.tbl td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}\n.tbl td:first-child{white-space:nowrap}\n.scroll{overflow-x:auto}\n.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}\n.cl{border-radius:var(--r);padding:20px;border:1.5px solid}\n.cl.high{background:var(--okbg);border-color:#9bd9bb}.cl.med{background:var(--holdbg);border-color:#ecd391}.cl.low{background:var(--rescuebg);border-color:#f2b9a8}\n.cl .n{font:600 34px 'IBM Plex Mono'}\n.cl p{font-size:14px;margin-top:6px;color:var(--ink2)}\n.cl b{display:block;margin-top:2px}\n.path{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:20px}\n.path.ok{border-top:6px solid var(--ok)}.path.no{border-top:6px solid var(--rescue)}\n.path ol{padding-left:20px;font-size:14px;color:var(--ink2)}\n.path li{margin-bottom:8px}.path li b{color:var(--ink)}\n.fcard{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--rescue);border-radius:14px;padding:16px;font-size:14px}\n.fcard .tt{font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}\n.fcard dl{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;color:var(--ink2)}\n.fcard dt{font:500 11px 'IBM Plex Mono';text-transform:uppercase;letter-spacing:.06em;padding-top:2px}\n.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:20px}\n.cut{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}\n.cut .panel ul{list-style:none;font-size:14px}\n.cut .panel li{padding:8px 0;border-bottom:1px dashed var(--line)}\n.cut .panel li:last-child{border:0}\n.cut .panel li small{display:block;color:var(--ink2)}\n.check li{list-style:none;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}\n.check label{display:flex;gap:10px;cursor:pointer;align-items:flex-start}\n.check input{margin-top:4px;accent-color:var(--ok)}\n.check input:checked+span{text-decoration:line-through;color:var(--grey)}\nfooter{background:var(--ink);color:#fff;padding:44px 0;margin-top:20px}\nfooter p{color:#b7c2e6;font-size:14px;max-width:640px}\n\n@media(max-width:1100px){\n .proto{grid-template-columns:1fr}\n .phone{margin:0 auto}\n .journey{grid-template-columns:repeat(2,1fr)}\n .screens{grid-template-columns:repeat(2,1fr)}\n}\n@media(max-width:760px){\n section{padding:52px 0}\n .hero .grid,.cols2,.conf,.nav-notes,.cut,.fgrid{grid-template-columns:1fr}\n .principles{grid-template-columns:1fr}\n .journey,.screens{grid-template-columns:1fr}\n .ticket{transform:none}\n}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\n/* Simple, family-friendly SpotSure presentation */\n#journey,#screens,#navigation,#status,#paths,#cuts,#handoff{display:none!important}\nnav.top .wrap{gap:10px}\n.hero h1{max-width:650px}\n.hero .grid{align-items:center}\n.hero .principles{margin-top:22px}\n.hero .pr{padding:14px}\n#prototype{padding-top:42px}\n#prototype .proto{grid-template-columns:minmax(220px,300px) minmax(320px,390px);justify-content:center;gap:24px}\n#prototype .proto>div:last-child{display:none}\n#prototype .proto>div:first-child .panel:nth-child(2){display:none}\n#prototype .panel{padding:15px}\n#prototype .lead{max-width:700px}\nfooter p{max-width:520px}\n@media(max-width:760px){\n #prototype .proto{grid-template-columns:minmax(0,1fr)}\n #prototype .proto>div:first-child{order:2}\n #prototype .phone{order:1}\n .hero .grid{grid-template-columns:1fr}\n}\n\n\n/* Visual-first guide for every family: icons do the explaining */\n.family-visual{padding:28px 0 34px;background:#fffaf0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}\n.family-visual .visual-row{display:grid;grid-template-columns:1.15fr repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}\n.family-visual .scene{background:#e3f4e9;border:1.5px solid #b7dfc7;border-radius:20px;min-height:150px;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden}\n.family-visual .visual-step{background:#fffdf8;border:1.5px solid var(--line);border-radius:20px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px}\n.family-visual .visual-icon{width:66px;height:66px;border-radius:20px;display:grid;place-items:center;font-size:34px;background:#e2ebff}\n.family-visual .visual-step:nth-child(3) .visual-icon{background:#fff0c8}\n.family-visual .visual-step:nth-child(4) .visual-icon{background:#dcf5e9}\n.family-visual .visual-label{font-size:14px;font-weight:700;text-align:center;color:var(--ink)}\n.family-visual .tiny-dots{display:flex;gap:5px;margin-top:2px}\n.family-visual .tiny-dots i{width:6px;height:6px;border-radius:50%;background:#b9c3d9}\n.family-visual .tiny-dots i:first-child{background:var(--ok);width:18px;border-radius:99px}\n.family-visual svg{width:100%;max-width:250px;height:auto}\n@media(max-width:760px){\n .family-visual{padding:18px 0}\n .family-visual .visual-row{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}\n .family-visual .scene{grid-column:1/-1;min-height:120px}\n .family-visual .visual-step{min-height:120px;padding:10px 5px;gap:7px}\n .family-visual .visual-icon{width:52px;height:52px;border-radius:16px;font-size:28px}\n .family-visual .visual-label{font-size:12px}\n}\n\n<\/style>\n<\/head>\n<body>\n\n<nav class=\"top\" aria-label=\"Sections\">\n  <div class=\"wrap\">\n    <a class=\"brand\" href=\"#top\"><span class=\"sign\">P<\/span>SpotSure<\/a>\n    <a class=\"l\" href=\"#prototype\">Try the demo<\/a>\n    <a class=\"btn amber sm\" href=\"login.html\" style=\"margin-left:auto\">Log in →<\/a>\n  <\/div>\n<\/nav>\n\n<header class=\"hero\" id=\"top\">\n  <div class=\"wrap grid\">\n    <div>\n      <span class=\"kicker\">Parking made simple<\/span>\n      <h1>Parking nearby, <em>without the stress.<\/em><\/h1>\n      <p>Find a parking spot, check the price, and book before you leave. If your first choice is not available, SpotSure helps you find another nearby option.<\/p>\n      <a class=\"btn amber\" href=\"#prototype\">▶ Try parking demo<\/a>\n      <a class=\"btn ghost\" href=\"#screens\">How it works<\/a>\n      <a class=\"btn\" href=\"login.html\">Log in →<\/a>\n      <a class=\"btn ghost\" href=\"consumer.html\">Driver page<\/a>\n      <a class=\"btn ghost\" href=\"provider.html\">Provider page<\/a>\n      <div class=\"principles\">\n        <div class=\"pr\"><b>1 · See the details<\/b><span>Check the location, price and parking rules.<\/span><\/div>\n        <div class=\"pr\"><b>2 · Reserve your spot<\/b><span>You get time to confirm your booking.<\/span><\/div>\n        <div class=\"pr\"><b>3 · Have a backup<\/b><span>If plans change, look for another spot.<\/span><\/div>\n      <\/div>\n    <\/div>\n    <aside class=\"ticket\" aria-label=\"Sample hold ticket\">\n      <div class=\"row\"><small>Example parking<\/small><b>Covered parking<\/b><\/div>\n      <div class=\"row\"><small>Status<\/small><span class=\"chip c-hold pulse\">On hold<\/span><\/div>\n      <div class=\"row\"><small>Availability<\/small><span class=\"chip c-ok\">Likely available<\/span><\/div>\n      <div class=\"row\" style=\"flex-direction:column;align-items:flex-start\"><small>Time to confirm<\/small><div class=\"timer-demo\" id=\"heroTimer\">09:42<\/div><\/div>\n    <\/aside>\n  <\/div>\n<\/header>\n\n<section class=\"family-visual\" aria-label=\"Simple visual guide\">\n  <div class=\"wrap visual-row\">\n    <div class=\"scene\" aria-label=\"Family arriving safely at a parking place\">\n      <svg viewBox=\"0 0 300 150\" role=\"img\" aria-label=\"Family, car and parking place illustration\">\n        <rect x=\"8\" y=\"8\" width=\"284\" height=\"134\" rx=\"18\" fill=\"#e3f4e9\"/>\n        <circle cx=\"246\" cy=\"31\" r=\"13\" fill=\"#ffd56a\"/>\n        <path d=\"M20 112 L65 72 L108 112\" fill=\"#b9d9c7\"/>\n        <path d=\"M55 112 L105 57 L160 112\" fill=\"#8fc6a5\"/>\n        <rect x=\"26\" y=\"100\" width=\"246\" height=\"25\" rx=\"7\" fill=\"#d3e5d7\"/>\n        <path d=\"M52 103h195\" stroke=\"#fffdf8\" stroke-width=\"3\" stroke-dasharray=\"12 9\"/>\n        <g transform=\"translate(72 61)\">\n          <circle cx=\"25\" cy=\"12\" r=\"11\" fill=\"#e9b28e\"/><path d=\"M14 11q1-14 13-12q10 2 9 12\" fill=\"#513b32\"/>\n          <path d=\"M12 26q13-10 26 0l5 25H7z\" fill=\"#2358d6\"/>\n          <circle cx=\"64\" cy=\"17\" r=\"9\" fill=\"#d89c75\"/><path d=\"M55 16q0-11 10-11q10 0 10 11\" fill=\"#3c2b27\"/>\n          <path d=\"M53 29q11-8 22 0l4 22H49z\" fill=\"#e5502b\"/>\n          <circle cx=\"44\" cy=\"36\" r=\"7\" fill=\"#e9b28e\"/><path d=\"M38 35q0-8 7-8q7 0 7 8\" fill=\"#5a3a2a\"/>\n          <path d=\"M36 45q8-6 16 0l3 13H33z\" fill=\"#f2a900\"/>\n        <\/g>\n        <g transform=\"translate(148 83)\">\n          <path d=\"M0 18L9 3Q12 0 18 0h44q7 0 11 7l7 11v19H0z\" fill=\"#fffdf8\" stroke=\"#101a33\" stroke-width=\"2.5\"/>\n          <path d=\"M16 5h40l7 12H8z\" fill=\"#9fc5ef\" stroke=\"#101a33\" stroke-width=\"1.5\"/>\n          <circle cx=\"16\" cy=\"37\" r=\"7\" fill=\"#101a33\"/><circle cx=\"64\" cy=\"37\" r=\"7\" fill=\"#101a33\"/>\n          <circle cx=\"16\" cy=\"37\" r=\"3\" fill=\"#fffdf8\"/><circle cx=\"64\" cy=\"37\" r=\"3\" fill=\"#fffdf8\"/>\n        <\/g>\n        <g transform=\"translate(229 51)\">\n          <path d=\"M0 14a14 14 0 1 1 28 0c0 10-14 25-14 25S0 24 0 14z\" fill=\"#2358d6\"/>\n          <circle cx=\"14\" cy=\"14\" r=\"5\" fill=\"#fffdf8\"/>\n        <\/g>\n      <\/svg>\n    <\/div>\n    <div class=\"visual-step\">\n      <div class=\"visual-icon\" aria-hidden=\"true\">📍<\/div>\n      <div class=\"visual-label\">📍<\/div>\n      <div class=\"tiny-dots\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n    <\/div>\n    <div class=\"visual-step\">\n      <div class=\"visual-icon\" aria-hidden=\"true\">₹<\/div>\n      <div class=\"visual-label\">₹<\/div>\n      <div class=\"tiny-dots\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n    <\/div>\n    <div class=\"visual-step\">\n      <div class=\"visual-icon\" aria-hidden=\"true\">🅿️<\/div>\n      <div class=\"visual-label\">✓<\/div>\n      <div class=\"tiny-dots\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<div class=\"lane\"><\/div>\n\n<!-- JOURNEY -->\n<section id=\"journey\">\n  <div class=\"wrap\">\n    <span class=\"kicker\">01 · Complete user journey<\/span>\n    <h2>From listing to parked: eight moments.<\/h2>\n    <p class=\"lead\">The eight steps from the brief, each tied to what the person sees and does. Blue cards are what the system does behind the screen; coral is the failure branch.<\/p>\n    <div class=\"journey\">\n      <div class=\"step\"><h3>Provider creates a listing<\/h3><p>Location, price, availability windows and vehicle restrictions go in a short guided form, with a preview of the driver's view.<\/p><span class=\"tag\">Provider · P1 → P2<\/span><\/div>\n      <div class=\"step\"><h3>Driver searches<\/h3><p>Where, when, which vehicle. Vehicle size is asked up front so restrictions filter results, not surprise the driver later.<\/p><span class=\"tag\">Driver · D1 → D2<\/span><\/div>\n      <div class=\"step\"><h3>Listing + evidence<\/h3><p>Photos, price, rules, and the <b>confidence panel<\/b> explaining why we think the space is free.<\/p><span class=\"tag\">Driver · D3<\/span><\/div>\n      <div class=\"step\"><h3>Driver requests a hold<\/h3><p>One clear button: “Save this spot for 10 minutes”. It states plainly that nothing is charged or final yet.<\/p><span class=\"tag\">Driver · D3 → D4<\/span><\/div>\n      <div class=\"step sys\"><h3>System checks conflicts<\/h3><p>Overlapping bookings and holds are checked. If clear, a valid hold with an expiry time is created.<\/p><span class=\"tag\">Booking system · D4<\/span><\/div>\n      <div class=\"step\"><h3>Driver confirms in time<\/h3><p>Countdown stays pinned on screen. Confirm turns the hold into a booking with a reference and entry instructions.<\/p><span class=\"tag\">Driver · D4 → D5<\/span><\/div>\n      <div class=\"step fail\"><h3>Rescue Engine steps in<\/h3><p>On conflict, expiry or provider cancellation, alternatives appear with <b>what changes<\/b> (distance, price, confidence).<\/p><span class=\"tag\">Failure · D6<\/span><\/div>\n      <div class=\"step fail\"><h3>Pick an alternative → re-check<\/h3><p>The system re-checks before reserving. If it was taken in the meantime, the driver is told and the list refreshes.<\/p><span class=\"tag\">Failure · D7 → D5<\/span><\/div>\n    <\/div>\n    <div class=\"legend\"><span><i style=\"background:#fffdf8\"><\/i>Driver action<\/span><span><i style=\"background:#eef1fb\"><\/i>System action<\/span><span><i style=\"background:#ffe5dd\"><\/i>Rescue branch<\/span><\/div>\n  <\/div>\n<\/section>\n\n<!-- SCREENS -->\n<section id=\"screens\" style=\"background:#ebe6d9\">\n  <div class=\"wrap\">\n    <span class=\"kicker\">02 · Screens, buttons, forms, messages<\/span>\n    <h2>Eleven screens. That's the whole product.<\/h2>\n    <p class=\"lead\">Each screen has one job. Filter by role to see what each side needs to build.<\/p>\n    <div class=\"filters\" role=\"tablist\" aria-label=\"Filter screens\">\n      <button class=\"fbtn on\" data-f=\"all\">All<\/button>\n      <button class=\"fbtn\" data-f=\"driver\">Driver<\/button>\n      <button class=\"fbtn\" data-f=\"provider\">Provider<\/button>\n      <button class=\"fbtn\" data-f=\"rescue\">Rescue only<\/button>\n    <\/div>\n    <div class=\"screens\" id=\"screenGrid\">\n\n      <article class=\"scard\" data-r=\"driver\">\n        <header><span class=\"sid\">D1<\/span><span class=\"chip c-info\">Search<\/span><\/header>\n        <h3>Find a space<\/h3><p class=\"why\">Capture where, when and what vehicle, the three things that decide fit.<\/p>\n        <h4>Forms<\/h4><ul><li>Area / landmark<\/li><li>Date<\/li><li>Start–end time<\/li><li>Vehicle type + height<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Find spaces<\/li><li>Use my location<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“End time must be after start.”<\/li><\/ul>\n        <div class=\"go\">→ D2 Results<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"driver\">\n        <header><span class=\"sid\">D2<\/span><span class=\"chip c-info\">Results<\/span><\/header>\n        <h3>Compare options<\/h3><p class=\"why\">Sorted by fit × confidence, so the safest good option is on top.<\/p>\n        <h4>Shows<\/h4><ul><li>Price for chosen window<\/li><li>Distance<\/li><li>Confidence chip<\/li><li>Restriction match<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">View space<\/li><li>Filter<\/li><li>Sort<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“No space fits? Try widening time →”<\/li><\/ul>\n        <div class=\"go\">→ D3 Detail · empty → D9 No match<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"driver\">\n        <header><span class=\"sid\">D3<\/span><span class=\"chip c-ok\">Evidence<\/span><\/header>\n        <h3>Listing detail + confidence<\/h3><p class=\"why\">The trust screen: details plus <i>why<\/i> we think it's free.<\/p>\n        <h4>Shows<\/h4><ul><li>Photos + map<\/li><li>Price breakdown<\/li><li>Rules<\/li><li>Availability for your window<\/li><li>Evidence list<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Save this spot for 10 minutes<\/li><li>Back to results<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“You have not confirmed the booking yet.”<\/li><li class=\"m\">Disabled CTA: “Too tall for this bay (max 1.9 m).”<\/li><\/ul>\n        <div class=\"go\">→ D4 Hold<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"driver\">\n        <header><span class=\"sid\">D4<\/span><span class=\"chip c-hold\">Hold<\/span><\/header>\n        <h3>Hold &amp; confirm<\/h3><p class=\"why\">Two states on one screen: checking, then countdown.<\/p>\n        <h4>Shows<\/h4><ul><li>“Checking if this spot is free…”<\/li><li>Big countdown + bar<\/li><li>Booking summary<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Confirm booking<\/li><li>Release hold<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“Held for you until 14:10.”<\/li><li class=\"m\">&lt; 60 s: “Hurry: hold ends soon.”<\/li><\/ul>\n        <div class=\"go\">→ D5 Booked · conflict/expiry → D6 Rescue<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"driver\">\n        <header><span class=\"sid\">D5<\/span><span class=\"chip c-ok\">Result<\/span><\/header>\n        <h3>Booking result<\/h3><p class=\"why\">One screen for the outcome, with a badge showing whether it was original or rescued.<\/p>\n        <h4>Shows<\/h4><ul><li>Status chip<\/li><li>Reference<\/li><li>Address + entry instructions<\/li><li>Time window<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Get directions<\/li><li>Add to calendar<\/li><li>Cancel booking<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“Confirmed. Show this reference at the gate.”<\/li><\/ul>\n        <div class=\"go\">→ D10 My bookings<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"driver rescue\">\n        <header><span class=\"sid\">D6<\/span><span class=\"chip c-rescue\">Rescue<\/span><\/header>\n        <h3>Rescue: alternatives<\/h3><p class=\"why\">Reason first, solution second, so the driver is calm, not confused.<\/p>\n        <h4>Shows<\/h4><ul><li>Reason banner<\/li><li>2–3 alternatives<\/li><li>“What changes” deltas<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Reserve this one<\/li><li>Change time<\/li><li>None of these<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“Your space isn't available. Here are close matches.”<\/li><\/ul>\n        <div class=\"go\">→ D7 Re-check · none → D9<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"driver rescue\">\n        <header><span class=\"sid\">D7<\/span><span class=\"chip c-rescue\">Re-check<\/span><\/header>\n        <h3>Alternative check<\/h3><p class=\"why\">A short interstitial: we verify again before promising anything.<\/p>\n        <h4>Shows<\/h4><ul><li>“Checking this spot is still free…”<\/li><li>Result banner<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Back to alternatives<\/li><li class=\"b\">View booking<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“Just taken. Showing other options.”<\/li><li class=\"m\">“Reserved. You're all set.”<\/li><\/ul>\n        <div class=\"go\">→ D5 Booked (rescued) or ↺ D6<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"driver rescue\">\n        <header><span class=\"sid\">D9<\/span><span class=\"chip c-grey\">Dead end<\/span><\/header>\n        <h3>No match / alert me<\/h3><p class=\"why\">Failure must never be a blank page. Always offer a next move.<\/p>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Widen search<\/li><li>Change time<\/li><li>Alert me when a spot opens<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“No spots are available right now. We can watch for you.”<\/li><\/ul>\n        <div class=\"go\">→ D1 Search<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"driver\">\n        <header><span class=\"sid\">D10<\/span><span class=\"chip c-grey\">History<\/span><\/header>\n        <h3>My bookings<\/h3><p class=\"why\">Single place to see status of every hold and booking, including expired ones.<\/p>\n        <h4>Shows<\/h4><ul><li>Status chips<\/li><li>Time + place<\/li><li>Active hold countdown<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Open<\/li><li>Cancel<\/li><\/ul>\n        <div class=\"go\">→ D5 / D4<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"provider\">\n        <header><span class=\"sid p\">P1<\/span><span class=\"chip c-info\">Provider<\/span><\/header>\n        <h3>Create listing<\/h3><p class=\"why\">Four short steps with a live “driver view” preview.<\/p>\n        <h4>Forms<\/h4><ul><li>Location pin + photos<\/li><li>Price per hour / day<\/li><li>Weekly availability + blackout dates<\/li><li>Max height, vehicle types<\/li><li>Entry instructions<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Publish listing<\/li><li>Save draft<\/li><li>Preview<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“Add a calendar sync to boost confidence.”<\/li><\/ul>\n        <div class=\"go\">→ P2 Dashboard<\/div>\n      <\/article>\n\n      <article class=\"scard\" data-r=\"provider\">\n        <header><span class=\"sid p\">P2<\/span><span class=\"chip c-info\">Provider<\/span><\/header>\n        <h3>Listing dashboard<\/h3><p class=\"why\">Provider sees what drivers see, including confidence, and what lowers it.<\/p>\n        <h4>Shows<\/h4><ul><li>Live / paused status<\/li><li>Upcoming bookings<\/li><li>Active holds<\/li><li>Confidence + tips<\/li><\/ul>\n        <h4>Buttons<\/h4><ul><li class=\"b\">Edit availability<\/li><li>Pause listing<\/li><\/ul>\n        <h4>Messages<\/h4><ul><li class=\"m\">“2 drivers have bookings. Pausing will trigger rescue for them.”<\/li><\/ul>\n        <div class=\"go\">Pause/cancel → D6 for affected drivers<\/div>\n      <\/article>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- NAVIGATION -->\n<section id=\"navigation\">\n  <div class=\"wrap\">\n    <span class=\"kicker\">03 · Navigation plan<\/span>\n    <h2>One main road, one rescue lane.<\/h2>\n    <p class=\"lead\">The happy path runs left to right. Every failure, whatever its cause, merges into the same Rescue lane, which keeps the design simple and the code reusable.<\/p>\n    <div class=\"diagram\">\n      <svg viewBox=\"0 0 1000 510\" role=\"img\" aria-label=\"Screen navigation diagram showing the happy path from Search to Booked and a rescue lane for failures\">\n        <defs>\n          <marker id=\"a\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#101a33\"/><\/marker>\n          <marker id=\"af\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#e5502b\"/><\/marker>\n          <marker id=\"ag\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"5\" orient=\"auto\"><path d=\"M0 0L10 5L0 10z\" fill=\"#14935f\"/><\/marker>\n        <\/defs>\n        <text x=\"20\" y=\"22\" class=\"al\">MAIN ROAD · DRIVER<\/text>\n        <!-- row 1 -->\n        <g><rect class=\"nbox\" x=\"20\" y=\"40\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"85\" y=\"62\" text-anchor=\"middle\">D1 Search<\/text><text class=\"ns\" x=\"85\" y=\"79\" text-anchor=\"middle\">where · when · vehicle<\/text><\/g>\n        <g><rect class=\"nbox\" x=\"185\" y=\"40\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"250\" y=\"62\" text-anchor=\"middle\">D2 Results<\/text><text class=\"ns\" x=\"250\" y=\"79\" text-anchor=\"middle\">ranked by confidence<\/text><\/g>\n        <g><rect class=\"nbox\" x=\"350\" y=\"40\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"415\" y=\"62\" text-anchor=\"middle\">D3 Detail<\/text><text class=\"ns\" x=\"415\" y=\"79\" text-anchor=\"middle\">+ evidence panel<\/text><\/g>\n        <g><rect class=\"nbox sys\" x=\"515\" y=\"40\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"580\" y=\"62\" text-anchor=\"middle\">D4 Hold<\/text><text class=\"ns\" x=\"580\" y=\"79\" text-anchor=\"middle\">conflict check → timer<\/text><\/g>\n        <g><rect class=\"nbox\" x=\"680\" y=\"40\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"745\" y=\"62\" text-anchor=\"middle\">D4 Confirm<\/text><text class=\"ns\" x=\"745\" y=\"79\" text-anchor=\"middle\">before expiry<\/text><\/g>\n        <g><rect class=\"nbox ok\" x=\"845\" y=\"40\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"910\" y=\"62\" text-anchor=\"middle\">D5 Booked<\/text><text class=\"ns\" x=\"910\" y=\"79\" text-anchor=\"middle\">ref · status · directions<\/text><\/g>\n        <path class=\"arr g\" d=\"M150 66H183\"/><path class=\"arr g\" d=\"M315 66H348\"/><path class=\"arr g\" d=\"M480 66H513\"/><path class=\"arr g\" d=\"M645 66H678\"/><path class=\"arr g\" d=\"M810 66H843\"/>\n\n        <!-- failure bar -->\n        <rect x=\"540\" y=\"140\" width=\"330\" height=\"34\" rx=\"17\" fill=\"#e5502b\"/>\n        <text x=\"705\" y=\"162\" text-anchor=\"middle\" fill=\"#fff\" font-size=\"12\" font-weight=\"600\" font-family=\"IBM Plex Mono, monospace\">FAILURE TRIGGERS<\/text>\n        <path class=\"arr f\" d=\"M580 92V138\"/><text class=\"al\" x=\"590\" y=\"118\">conflict<\/text>\n        <path class=\"arr f\" d=\"M745 92V138\"/><text class=\"al\" x=\"755\" y=\"118\">hold expired<\/text>\n        <path class=\"arr f\" d=\"M858 92V138\"/><text class=\"al\" x=\"780\" y=\"130\" style=\"display:none\">x<\/text>\n        <text class=\"al\" x=\"866\" y=\"118\" text-anchor=\"start\" style=\"display:none\"><\/text>\n        <text class=\"al\" x=\"800\" y=\"104\">provider cancels<\/text>\n        <path class=\"arr f\" d=\"M580 174V248\"/>\n\n        <!-- rescue lane -->\n        <text x=\"515\" y=\"236\" class=\"al\" fill=\"#e5502b\">RESCUE LANE<\/text>\n        <g><rect class=\"nbox res\" x=\"515\" y=\"250\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"580\" y=\"272\" text-anchor=\"middle\">D6 Rescue<\/text><text class=\"ns\" x=\"580\" y=\"289\" text-anchor=\"middle\">2–3 alternatives<\/text><\/g>\n        <g><rect class=\"nbox res\" x=\"680\" y=\"250\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"745\" y=\"272\" text-anchor=\"middle\">D7 Re-check<\/text><text class=\"ns\" x=\"745\" y=\"289\" text-anchor=\"middle\">verify, then reserve<\/text><\/g>\n        <g><rect class=\"nbox\" x=\"350\" y=\"250\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"415\" y=\"272\" text-anchor=\"middle\">D9 No match<\/text><text class=\"ns\" x=\"415\" y=\"289\" text-anchor=\"middle\">widen · alert me<\/text><\/g>\n        <path class=\"arr f\" d=\"M645 276H680\"/>\n        <path class=\"arr f\" d=\"M515 276H482\"/><text class=\"al\" x=\"487\" y=\"318\">none work<\/text>\n        <path class=\"arr g\" d=\"M810 276H940V94\"/><text class=\"al\" x=\"946\" y=\"190\" transform=\"rotate(90 946 190)\">reserved ✓<\/text>\n        <path class=\"arr f\" d=\"M745 302V345H590V304\"/><text class=\"al\" x=\"610\" y=\"362\">taken → re-offer list<\/text>\n        <path class=\"arr\" d=\"M350 276H85V94\" stroke-dasharray=\"2 5\"/><text class=\"al\" x=\"110\" y=\"270\">retry search<\/text>\n\n        <!-- provider row -->\n        <text x=\"20\" y=\"418\" class=\"al\">PROVIDER SIDE · FEEDS D2<\/text>\n        <g><rect class=\"nbox pro\" x=\"20\" y=\"430\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"85\" y=\"452\" text-anchor=\"middle\">P1 Create<\/text><text class=\"ns\" x=\"85\" y=\"469\" text-anchor=\"middle\">location · price · rules<\/text><\/g>\n        <g><rect class=\"nbox pro\" x=\"185\" y=\"430\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"250\" y=\"452\" text-anchor=\"middle\">P1 Preview<\/text><text class=\"ns\" x=\"250\" y=\"469\" text-anchor=\"middle\">driver's-eye view<\/text><\/g>\n        <g><rect class=\"nbox pro\" x=\"350\" y=\"430\" width=\"130\" height=\"52\" rx=\"12\"/><text class=\"nt\" x=\"415\" y=\"452\" text-anchor=\"middle\">P2 Dashboard<\/text><text class=\"ns\" x=\"415\" y=\"469\" text-anchor=\"middle\">live · holds · bookings<\/text><\/g>\n        <path class=\"arr\" d=\"M150 456H183\" style=\"stroke:#2358d6\"/><path class=\"arr\" d=\"M315 456H348\" style=\"stroke:#2358d6\"/>\n        <path class=\"arr f\" d=\"M480 456H720\" /><text class=\"al\" x=\"500\" y=\"448\">pause / cancel with bookings → triggers D6 for those drivers<\/text>\n      <\/svg>\n    <\/div>\n    <div class=\"nav-notes\">\n      <div class=\"note\"><b>Persistent bottom bar<\/b>Search · My bookings · Help. Only three items, so the driver can always find an active hold.<\/div>\n      <div class=\"note\"><b>Active-hold pill<\/b>While a hold runs, a small timer pill floats above every screen so leaving D4 never loses the countdown.<\/div>\n      <div class=\"note\"><b>Back behaviour<\/b>Back from D6/D7 never returns to a dead hold. It goes to D2 results, so the driver never sees a stale “Confirm” button.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n<div class=\"lane\"><\/div>\n\n<!-- PROTOTYPE -->\n<section id=\"prototype\">\n  <div class=\"wrap\">\n    <span class=\"kicker\">Try it on this phone<\/span>\n    <h2>Find and book a parking spot<\/h2>\n    <p class=\"lead\">Choose a sample situation, then use the phone screen to search, check a spot and book. This is a demo, so you can try it without making a real payment.<\/p>\n    <div class=\"proto\">\n      <div>\n        <div class=\"panel scn\">\n          <h3>Try a sample<\/h3>\n          <label><input type=\"radio\" name=\"scn\" value=\"happy\" checked><span><b>Normal booking<\/b><small>Choose a spot and confirm it.<\/small><\/span><\/label>\n          <label><input type=\"radio\" name=\"scn\" value=\"conflict\"><span><b>Spot already taken<\/b><small>See what happens if it is no longer free.<\/small><\/span><\/label>\n          <label><input type=\"radio\" name=\"scn\" value=\"expiry\"><span><b>Time runs out<\/b><small>Try again or look at other spots.<\/small><\/span><\/label>\n          <label><input type=\"radio\" name=\"scn\" value=\"cancel\"><span><b>Spot becomes unavailable<\/b><small>Find another parking option.<\/small><\/span><\/label>\n          <button class=\"btn ghost sm full\" id=\"resetBtn\" style=\"margin-top:6px\">↺ Restart demo<\/button>\n        <\/div>\n        <div class=\"panel\" style=\"margin-top:16px\">\n          <h3>Brief steps<\/h3>\n          <ol class=\"tracker\" id=\"tracker\">\n            <li data-n=\"1\"><b>1<\/b>Provider creates listing<\/li>\n            <li data-n=\"2\"><b>2<\/b>Driver searches<\/li>\n            <li data-n=\"3\"><b>3<\/b>Details + confidence shown<\/li>\n            <li data-n=\"4\"><b>4<\/b>Driver requests hold<\/li>\n            <li data-n=\"5\"><b>5<\/b>System checks &amp; creates hold<\/li>\n            <li data-n=\"6\"><b>6<\/b>Driver confirms before expiry<\/li>\n            <li data-n=\"7\"><b>7<\/b>Rescue Engine finds alternatives<\/li>\n            <li data-n=\"8\"><b>8<\/b>Pick alternative → check → reserve<\/li>\n          <\/ol>\n        <\/div>\n      <\/div>\n\n      <div class=\"phone\" aria-label=\"Interactive phone prototype\">\n        <div class=\"notch\"><\/div>\n        <div class=\"screen\">\n          <div class=\"appbar\"><button class=\"back\" id=\"backBtn\" aria-label=\"Back\" style=\"visibility:hidden\">←<\/button><b id=\"barTitle\">SpotSure<\/b><span id=\"barChip\"><\/span><\/div>\n\n          <!-- D1 -->\n          <div class=\"scr on\" id=\"s-search\">\n            <div class=\"field\"><label for=\"q\">Where<\/label><input id=\"q\" value=\"Central Plaza\"><\/div>\n            <div class=\"two\">\n              <div class=\"field\"><label for=\"d\">Date<\/label><input id=\"d\" value=\"Today\"><\/div>\n              <div class=\"field\"><label for=\"v\">Vehicle<\/label><select id=\"v\"><option>Hatchback<\/option><option>SUV<\/option><option>Van<\/option><\/select><\/div>\n            <\/div>\n            <div class=\"two\">\n              <div class=\"field\"><label for=\"t1\">From<\/label><input id=\"t1\" value=\"14:00\"><\/div>\n              <div class=\"field\"><label for=\"t2\">Until<\/label><input id=\"t2\" value=\"17:00\"><\/div>\n            <\/div>\n            <div class=\"banner info\"><span>ℹ<\/span><span>We show spots that suit your vehicle and are likely to be free.<\/span><\/div>\n            <button class=\"btn amber full\" id=\"goSearch\">Find spaces<\/button>\n          <\/div>\n\n          <!-- D2 -->\n          <div class=\"scr\" id=\"s-results\"><\/div>\n          <!-- D3 -->\n          <div class=\"scr\" id=\"s-detail\"><\/div>\n\n          <!-- D4 -->\n          <div class=\"scr\" id=\"s-hold\">\n            <div id=\"holdChecking\" class=\"center\"><div class=\"spin\"><\/div><b>Checking if this spot is free…<\/b><p style=\"color:var(--ink2);font-size:14px;margin-top:4px\">Checking whether someone else has booked this time.<\/p><\/div>\n            <div id=\"holdActive\" style=\"display:none\">\n              <div class=\"banner hold\"><span>⏱<\/span><span><b>This spot is saved for you.<\/b> You have not confirmed the booking yet.<\/span><\/div>\n              <div class=\"clock\"><div class=\"big\" id=\"clk\">02:00<\/div><small class=\"mono\" style=\"color:var(--ink2)\">TIME LEFT TO CONFIRM<\/small><\/div>\n              <div class=\"bar\"><i id=\"clkBar\"><\/i><\/div>\n              <div id=\"holdSum\"><\/div>\n              <div class=\"stack\"><button class=\"btn green full\" id=\"confirmBtn\">Confirm booking<\/button><button class=\"btn ghost full\" id=\"releaseBtn\">Release hold<\/button><\/div>\n            <\/div>\n            <div id=\"holdExpired\" style=\"display:none\">\n              <div class=\"banner bad\"><span>⌛<\/span><span><b>Your saved time has ended.<\/b> It may still be free, but it is not saved for you now.<\/span><\/div>\n              <div class=\"stack\"><button class=\"btn coral full\" id=\"expRescue\">See other spots<\/button><button class=\"btn ghost full\" id=\"expRetry\">Try holding the same space again<\/button><\/div>\n            <\/div>\n          <\/div>\n\n          <!-- D5 -->\n          <div class=\"scr\" id=\"s-booked\">\n            <div class=\"banner good\" id=\"bkBanner\"><\/div>\n            <div class=\"banner bad\" id=\"cancelBanner\" style=\"display:none;flex-direction:column;gap:8px\"><span><b>Update from the provider.<\/b> This space is no longer available. We've already found alternatives.<\/span><button class=\"btn coral sm\" id=\"cancelRescue\">See alternatives<\/button><\/div>\n            <div class=\"ref\" id=\"bkRef\">SS-0000<\/div>\n            <div id=\"bkSum\"><\/div>\n            <div class=\"stack\"><button class=\"btn full\">Get directions<\/button><button class=\"btn ghost full\" id=\"newSearch\">Book another space<\/button><\/div>\n          <\/div>\n\n          <!-- D6 -->\n          <div class=\"scr\" id=\"s-rescue\">\n            <div id=\"resSearching\" class=\"center\"><div class=\"spin\"><\/div><b>Looking for other parking spots…<\/b><p style=\"color:var(--ink2);font-size:14px;margin-top:4px\">Checking nearby spots for your time and vehicle.<\/p><\/div>\n            <div id=\"resList\" style=\"display:none\"><\/div>\n          <\/div>\n\n          <!-- D7 -->\n          <div class=\"scr\" id=\"s-recheck\"><div class=\"center\"><div class=\"spin\"><\/div><b>Checking this spot is still free…<\/b><p style=\"color:var(--ink2);font-size:14px;margin-top:4px\">Making sure it's still free before we reserve it.<\/p><\/div><\/div>\n\n          <!-- D9 -->\n          <div class=\"scr\" id=\"s-wait\">\n            <div class=\"banner info\"><span>🔔<\/span><span><b>No spots are available right now.<\/b> You can ask to be alerted if a spot becomes free.<\/span><\/div>\n            <div class=\"stack\"><button class=\"btn amber full\" id=\"alertBtn\">Alert me when a spot opens<\/button><button class=\"btn ghost full\" id=\"widenBtn\">Change time or area<\/button><\/div>\n          <\/div>\n\n          <div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n        <\/div>\n      <\/div>\n\n      <div>\n        <div class=\"panel\">\n          <h3>Behind the screen (system log)<\/h3>\n          <div class=\"logbox mono\" id=\"log\" aria-live=\"polite\"><\/div>\n        <\/div>\n        <div class=\"panel\" style=\"margin-top:16px\">\n          <h3>Try this<\/h3>\n          <p style=\"font-size:14px;color:var(--ink2)\">In <b>Rescue<\/b>, choose the lowest-confidence alternative (“Riverside Driveway”). It will be “just taken” on re-check, which shows how D7 loops back instead of failing silently.<\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- STATUS & CONFIDENCE -->\n<section id=\"status\" style=\"background:#ebe6d9\">\n  <div class=\"wrap\">\n    <span class=\"kicker\">05 · Communicating status &amp; confidence<\/span>\n    <h2>Say what's true, say what happens next.<\/h2>\n    <p class=\"lead\">Every booking state has one colour, one chip and one sentence telling the driver what they can do. Confidence is always shown as <b>label → reason → number<\/b>, in that order.<\/p>\n\n    <div class=\"conf\">\n      <div class=\"cl high\"><span class=\"chip c-ok\">High confidence<\/span><div class=\"n\">80–100<\/div><b>“Very likely free”<\/b><p>Live calendar sync, verified provider, clean cancellation history. Full-colour CTA.<\/p><\/div>\n      <div class=\"cl med\"><span class=\"chip c-hold\">Medium confidence<\/span><div class=\"n\">55–79<\/div><b>“Probably free, worth confirming”<\/b><p>Partial evidence. CTA stays on, but a one-line caution is shown above it.<\/p><\/div>\n      <div class=\"cl low\"><span class=\"chip c-rescue\">Low confidence<\/span><div class=\"n\">0–54<\/div><b>“Uncertain. Hold lets us check”<\/b><p>Hold allowed, with a visible “Backup ready” promise so the driver isn't gambling.<\/p><\/div>\n    <\/div>\n\n    <div class=\"cols2\">\n      <div>\n        <h3 style=\"margin-bottom:10px\">Evidence the driver can see (D3)<\/h3>\n        <div class=\"scroll\"><table class=\"tbl\">\n          <tr><th>Signal<\/th><th>How it's shown<\/th><\/tr>\n          <tr><td>Provider verified<\/td><td>✓ “ID and phone verified”<\/td><\/tr>\n          <tr><td>Calendar freshness<\/td><td>✓ “Synced 4 min ago” / ! “Manual, last updated 3 days ago”<\/td><\/tr>\n          <tr><td>Reliability<\/td><td>✓ “41 bookings, 0 provider cancellations (90 days)”<\/td><\/tr>\n          <tr><td>Photo / location match<\/td><td>✓ “Photos match the pin”<\/td><\/tr>\n          <tr><td>Conflicts for your window<\/td><td>✓ “No overlapping holds right now”<\/td><\/tr>\n          <tr><td>Vehicle fit<\/td><td>✓ / ✕ “Your hatchback fits (max 1.9 m)”<\/td><\/tr>\n        <\/table><\/div>\n        <p class=\"note\" style=\"margin-top:12px\"><b>Rule:<\/b> never show a bare percentage. “92” alone is meaningless; “High · calendar synced 4 min ago” is credible.<\/p>\n      <\/div>\n      <div>\n        <h3 style=\"margin-bottom:10px\">Booking status vocabulary<\/h3>\n        <div class=\"scroll\"><table class=\"tbl\">\n          <tr><th>Status<\/th><th>Driver sees<\/th><\/tr>\n          <tr><td><span class=\"chip c-info\">Available<\/span><\/td><td>“Free for your time.” → Hold<\/td><\/tr>\n          <tr><td><span class=\"chip c-hold pulse\">On hold<\/span><\/td><td>Countdown + “Confirm before 14:10”<\/td><\/tr>\n          <tr><td><span class=\"chip c-ok\">Confirmed<\/span><\/td><td>Reference + directions<\/td><\/tr>\n          <tr><td><span class=\"chip c-grey\">Hold expired<\/span><\/td><td>“Your saved time has ended.” → alternatives / retry<\/td><\/tr>\n          <tr><td><span class=\"chip c-rescue\">Conflict<\/span><\/td><td>“Someone got there first.” → Rescue<\/td><\/tr>\n          <tr><td><span class=\"chip c-rescue pulse\">Finding alternatives<\/span><\/td><td>Progress state, never longer than a few seconds<\/td><\/tr>\n          <tr><td><span class=\"chip c-ok\">Rescued<\/span><\/td><td>Confirmed + “Replacement for your original space”<\/td><\/tr>\n          <tr><td><span class=\"chip c-rescue\">Cancelled by provider<\/span><\/td><td>Alternatives already attached<\/td><\/tr>\n        <\/table><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"cols2\" style=\"margin-top:26px\">\n      <div class=\"note\"><b>How alternative parking is presented<\/b>Always as a <i>delta<\/i> from what the driver lost: “+0.5 km · ₹15 cheaper · Medium confidence”. Best match first, max three, each with one button. Drivers compare change, not raw specs.<\/div>\n      <div class=\"note\"><b>Stretch idea · “Backup ready”<\/b>When a hold is placed on a Low/Medium space, the Rescue Engine quietly pre-computes one alternative. If the hold fails, the Rescue screen opens instantly. Flag as stretch if Aditya's backend can't support it.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- PATHS -->\n<section id=\"paths\">\n  <div class=\"wrap\">\n    <span class=\"kicker\">06 · Successful and unsuccessful journeys<\/span>\n    <h2>Seven ways it can go. Only one is perfect.<\/h2>\n    <p class=\"lead\">Designing the failures first keeps the product honest. Each failure has a trigger, a message and a way out.<\/p>\n\n    <div class=\"cols2\">\n      <div class=\"path ok\"><h3 style=\"margin-bottom:10px\">✓ Success path<\/h3>\n        <ol>\n          <li><b>D1<\/b> enter area, time, vehicle → Find spaces<\/li>\n          <li><b>D2<\/b> sees High-confidence space on top → opens it<\/li>\n          <li><b>D3<\/b> reads evidence → “Save this spot for 10 minutes”<\/li>\n          <li><b>D4<\/b> “Checking…” → countdown starts<\/li>\n          <li><b>D4<\/b> taps Confirm with time to spare<\/li>\n          <li><b>D5<\/b> status Confirmed, reference, directions<\/li>\n        <\/ol>\n      <\/div>\n      <div class=\"path no\"><h3 style=\"margin-bottom:10px\">↯ Rescue path<\/h3>\n        <ol>\n          <li><b>Trigger<\/b> conflict / expiry / provider cancel<\/li>\n          <li><b>D6<\/b> reason banner + 2–3 alternatives with deltas<\/li>\n          <li><b>D6<\/b> driver picks one → “Reserve this one”<\/li>\n          <li><b>D7<\/b> “Checking…” → system re-verifies<\/li>\n          <li><b>D5<\/b> Confirmed · badge “Rescued”<\/li>\n          <li><b>↺ or D9<\/b> if taken → refreshed list; if none → alert me<\/li>\n        <\/ol>\n      <\/div>\n    <\/div>\n\n    <div class=\"fgrid\">\n      <div class=\"fcard\"><div class=\"tt\">F1 · Conflict at hold <span class=\"chip c-rescue\">D4 → D6<\/span><\/div><dl><dt>Trigger<\/dt><dd>Another driver's hold or booking overlaps.<\/dd><dt>Shows<\/dt><dd>“Someone got there first. Here are close matches.”<\/dd><dt>Way out<\/dt><dd>Alternatives, already ranked.<\/dd><\/dl><\/div>\n      <div class=\"fcard\"><div class=\"tt\">F2 · Hold expires <span class=\"chip c-rescue\">D4 → D6<\/span><\/div><dl><dt>Trigger<\/dt><dd>Timer reaches 0 without confirmation.<\/dd><dt>Shows<\/dt><dd>“Your saved time has ended.” Confirm button disabled instantly.<\/dd><dt>Way out<\/dt><dd>“Try the same space again” or alternatives.<\/dd><\/dl><\/div>\n      <div class=\"fcard\"><div class=\"tt\">F3 · Provider cancels after confirm <span class=\"chip c-rescue\">D5 → D6<\/span><\/div><dl><dt>Trigger<\/dt><dd>Provider pauses/cancels a booked window.<\/dd><dt>Shows<\/dt><dd>Push + banner on D5: alternatives are already waiting.<\/dd><dt>Way out<\/dt><dd>One-tap reserve of an alternative.<\/dd><\/dl><\/div>\n      <div class=\"fcard\"><div class=\"tt\">F4 · Alternative taken <span class=\"chip c-rescue\">D7 → D6<\/span><\/div><dl><dt>Trigger<\/dt><dd>Re-check fails.<\/dd><dt>Shows<\/dt><dd>“Just taken. Showing other options.” Toast, list refreshes.<\/dd><dt>Way out<\/dt><dd>Remaining options, no restart.<\/dd><\/dl><\/div>\n      <div class=\"fcard\"><div class=\"tt\">F5 · No alternatives <span class=\"chip c-rescue\">D6 → D9<\/span><\/div><dl><dt>Trigger<\/dt><dd>Engine finds nothing within limits.<\/dd><dt>Shows<\/dt><dd>“No spots are available right now.”<\/dd><dt>Way out<\/dt><dd>Widen search, change time, alert me.<\/dd><\/dl><\/div>\n      <div class=\"fcard\"><div class=\"tt\">F6 · Vehicle doesn't fit <span class=\"chip c-rescue\">D3<\/span><\/div><dl><dt>Trigger<\/dt><dd>Vehicle height/type breaks listing rule.<\/dd><dt>Shows<\/dt><dd>Hold button disabled with the exact reason.<\/dd><dt>Way out<\/dt><dd>“See spaces that fit your vehicle.”<\/dd><\/dl><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- CUTS -->\n<section id=\"cuts\" style=\"background:#ebe6d9\">\n  <div class=\"wrap\">\n    <span class=\"kicker\">07 · Confusing steps &amp; unnecessary features<\/span>\n    <h2>Make it smaller before it gets bigger.<\/h2>\n    <p class=\"lead\">Risks we spotted in the brief, and what we recommend for the proposal.<\/p>\n    <div class=\"cut\">\n      <div class=\"panel\"><h3>Confusing steps → fixes<\/h3><ul>\n        <li><b>“Hold” vs “Book”<\/b><small>Drivers may think a hold is a booking. Use a timer and “Nothing is charged yet”.<\/small><\/li>\n        <li><b>Expiry is silent<\/b><small>Countdown pinned on every screen + disable Confirm the moment it ends.<\/small><\/li>\n        <li><b>Why alternatives?<\/b><small>Always lead D6 with the reason, then the options.<\/small><\/li>\n        <li><b>Confidence jargon<\/b><small>Use High / Medium / Low plus reasons; number is secondary.<\/small><\/li>\n        <li><b>Vehicle asked too late<\/b><small>Move vehicle to D1 so rules filter D2.<\/small><\/li>\n      <\/ul><\/div>\n      <div class=\"panel\"><h3>Keep for the MVP<\/h3><ul>\n        <li><b>Search → detail → hold → confirm<\/b><small>The core loop from the brief.<\/small><\/li>\n        <li><b>Evidence panel<\/b><small>Our differentiator.<\/small><\/li>\n        <li><b>Rescue screen + re-check<\/b><small>The other differentiator.<\/small><\/li>\n        <li><b>Provider create + dashboard<\/b><small>Needed to supply listings.<\/small><\/li>\n        <li><b>My bookings<\/b><small>Active holds must be findable.<\/small><\/li>\n      <\/ul><\/div>\n      <div class=\"panel\"><h3>Cut or postpone<\/h3><ul>\n        <li><b>In-app chat<\/b><small>Entry instructions cover most needs.<\/small><\/li>\n        <li><b>Reviews &amp; ratings UI<\/b><small>Reliability stats already give trust.<\/small><\/li>\n        <li><b>Recurring / monthly bookings<\/b><small>Phase 2.<\/small><\/li>\n        <li><b>Social login, loyalty, referrals<\/b><small>No value for the proposal.<\/small><\/li>\n        <li><b>Heavy map filters<\/b><small>Simple list + small map is enough.<\/small><\/li>\n      <\/ul><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- HANDOFF -->\n<section id=\"handoff\">\n  <div class=\"wrap\">\n    <span class=\"kicker\">08 · Coordinating with Aditya<\/span>\n    <h2>One shared contract, so design and flow never drift.<\/h2>\n    <p class=\"lead\">Agree these items once, then both sides use the same names. Tick them off as you review together.<\/p>\n    <div class=\"cols2\">\n      <div class=\"panel\"><h3>Shared naming<\/h3>\n        <div class=\"scroll\"><table class=\"tbl\" style=\"font-size:13px\">\n          <tr><th>Item<\/th><th>Agreed value<\/th><\/tr>\n          <tr><td>Screen IDs<\/td><td class=\"mono\">D1–D10, P1–P2<\/td><\/tr>\n          <tr><td>Booking states<\/td><td class=\"mono\">available · on_hold · confirmed · expired · conflict · rescuing · rescued · cancelled<\/td><\/tr>\n          <tr><td>Confidence levels<\/td><td class=\"mono\">high ≥80 · medium 55–79 · low &lt;55<\/td><\/tr>\n          <tr><td>Hold length<\/td><td class=\"mono\">10 min (demo uses 2 min)<\/td><\/tr>\n          <tr><td>Rescue triggers<\/td><td class=\"mono\">hold_conflict · hold_expired · provider_cancelled<\/td><\/tr>\n          <tr><td>Alternatives<\/td><td class=\"mono\">max 3, ranked, each with deltas<\/td><\/tr>\n        <\/table><\/div>\n      <\/div>\n      <div class=\"panel\"><h3>Review checklist<\/h3>\n        <ul class=\"check\">\n          <li><label><input type=\"checkbox\"><span>Visual style (colours, chips, fonts) matches Aditya's design<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\"><span>Navigation diagram matches his user-flow diagram<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\"><span>Status vocabulary identical in design and code<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\"><span>Countdown component spec: states, colours, &lt;60 s warning<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\"><span>Rescue screen content: reason + deltas + max 3 options<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\"><span>Empty, loading and error state for every screen<\/span><\/label><\/li>\n          <li><label><input type=\"checkbox\"><span>“Backup ready” stretch: in or out?<\/span><\/label><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n    <div class=\"note\" style=\"margin-top:18px\"><b>Open questions for Aditya<\/b>Does the backend return an <span class=\"mono\">expires_at<\/span> timestamp for the hold? Can the Rescue Engine return ranked alternatives with distance/price/confidence deltas in one response? Will provider cancellation push a notification, or does the frontend poll?<\/div>\n  <\/div>\n<\/section>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"brand\" style=\"color:#fff;margin-bottom:10px\"><span class=\"sign\">P<\/span>SpotSure<\/div>\n    <p>SpotSure helps you find, compare and book parking in a few simple steps.<\/p>\n  <\/div>\n<\/footer>\n\n<script>\n(function(){\n  /* hero ticker */\n  var ht=document.getElementById('heroTimer'),hs=582;\n  setInterval(function(){hs=hs<=0?599:hs-1;ht.textContent=('0'+Math.floor(hs/60)).slice(-2)+':'+('0'+hs%60).slice(-2)},1000);\n\n  /* screen filter */\n  document.querySelectorAll('.fbtn').forEach(function(b){\n    b.addEventListener('click',function(){\n      document.querySelectorAll('.fbtn').forEach(function(x){x.classList.remove('on')});\n      b.classList.add('on');\n      var f=b.dataset.f;\n      document.querySelectorAll('#screenGrid .scard').forEach(function(c){\n        c.classList.toggle('hide',!(f==='all'||c.dataset.r.split(' ').indexOf(f)>-1));\n      });\n    });\n  });\n\n  /* ---------- prototype ---------- */\n  var L=[\n    {id:'A',name:'Central Plaza Covered Bay',km:0.3,rate:60,conf:92,rules:'Max height 1.9 m · No vans',ev:[['ok','Provider ID verified'],['ok','Calendar synced 4 min ago'],['ok','41 bookings, 0 provider cancellations (90 days)'],['ok','Photos match the location'],['ok','No overlapping holds right now']]},\n    {id:'B',name:'Station Road Gated Lot',km:0.8,rate:45,conf:71,rules:'Max height 2.1 m · All vehicles',ev:[['ok','Provider ID verified'],['wn','Manual calendar, updated yesterday'],['ok','17 bookings, 1 provider cancellation (90 days)'],['ok','Photos match the location']]},\n    {id:'C',name:'Riverside Driveway',km:1.2,rate:30,conf:48,fails:true,rules:'Max height 1.8 m · Cars only',ev:[['ok','Provider phone verified'],['wn','Manual calendar, updated 3 days ago'],['no','3 provider cancellations (90 days)'],['wn','Only 1 photo']]},\n    {id:'D',name:'Market Street Parking Deck',km:0.6,rate:50,conf:84,rules:'Max height 2.0 m · All vehicles',ev:[['ok','Provider ID verified'],['ok','Calendar synced 12 min ago'],['ok','63 bookings, 0 provider cancellations (90 days)'],['ok','Photos match the location']]}\n  ];\n  function lvl(c){return c>=80?'high':c>=55?'med':'low'}\n  function lblc(c){return c>=80?'High':c>=55?'Medium':'Low'}\n  function chipc(c){return c>=80?'c-ok':c>=55?'c-hold':'c-rescue'}\n  function meter(c){return '<div class=\"meter '+lvl(c)+'\"><i style=\"width:'+c+'%\"><\/i><\/div>'}\n  function cost(l){return '₹'+(l.rate*3)}\n\n  var S={scn:'happy',cur:null,timer:null,left:0,total:120,rescued:false,reason:''};\n  var $=function(id){return document.getElementById(id)};\n  var logEl=$('log'),toastEl=$('toast'),tt;\n\n  function log(m,c){var p=document.createElement('p');p.className=c||'s';p.textContent=new Date().toTimeString().slice(0,8)+'  '+m;logEl.appendChild(p);logEl.scrollTop=logEl.scrollHeight}\n  function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('show')},3200)}\n  function step(n){document.querySelectorAll('#tracker li').forEach(function(li){var k=+li.dataset.n;li.className=k<n?'done':k===n?'now':''})}\n  var history_=[];\n  var titles={search:'Find a space',results:'Results',detail:'Space details',hold:'Hold',booked:'Booking',rescue:'Rescue',recheck:'Checking',wait:'No match'};\n  function go(id,noPush){\n    document.querySelectorAll('.scr').forEach(function(s){s.classList.remove('on')});\n    $('s-'+id).classList.add('on');\n    $('barTitle').textContent=titles[id];\n    $('backBtn').style.visibility=(id==='results'||id==='detail')?'visible':'hidden';\n    $('backBtn').dataset.to=id==='detail'?'results':'search';\n    var ch=$('barChip');ch.className='';ch.textContent='';\n    $('s-'+id).scrollTop=0;\n  }\n  function chip(txt,cls,pulse){var ch=$('barChip');ch.className='chip '+cls+(pulse?' pulse':'');ch.textContent=txt}\n\n  $('backBtn').onclick=function(){go(this.dataset.to);if(this.dataset.to==='search')step(2)};\n\n  /* D1 -> D2 */\n  $('goSearch').onclick=function(){\n    log('Driver search: '+$('q').value+' · '+$('t1').value+'–'+$('t2').value+' · '+$('v').value,'u');\n    log('Search service: 4 candidates, ranked by fit × confidence','s');\n    step(2);renderResults();go('results');\n  };\n  function renderResults(){\n    var h='<div class=\"banner info\"><span>↕<\/span><span>Best fit &amp; confidence first. '+$('v').value+', '+$('t1').value+'–'+$('t2').value+'<\/span><\/div>';\n    L.slice().sort(function(a,b){return b.conf-a.conf}).forEach(function(l){\n      h+='<div class=\"lcard\" data-id=\"'+l.id+'\" tabindex=\"0\"><div class=\"t\"><b>'+l.name+'<\/b><span class=\"chip '+chipc(l.conf)+'\">'+lblc(l.conf)+'<\/span><\/div>'+meter(l.conf)+'<div class=\"m\"><span>'+l.km+' km · '+l.rules.split(' · ')[0]+'<\/span><b>'+cost(l)+'<\/b><\/div><\/div>';\n    });\n    $('s-results').innerHTML=h;\n    document.querySelectorAll('#s-results .lcard').forEach(function(c){\n      var open=function(){S.cur=L.filter(function(x){return x.id===c.dataset.id})[0];log('Driver opened '+S.cur.name,'u');step(3);renderDetail();go('detail')};\n      c.onclick=open;c.onkeydown=function(e){if(e.key==='Enter')open()};\n    });\n  }\n  function renderDetail(){\n    var l=S.cur,vanBlock=($('v').value==='Van'&&/No vans|Cars only/.test(l.rules));\n    var ev='';l.ev.forEach(function(e){ev+='<div class=\"'+e[0]+'\">'+e[1]+'<\/div>'});\n    var cap=l.conf>=80?'Very likely free.':l.conf>=55?'Probably free, worth confirming.':'Uncertain. A hold lets us check for you.';\n    $('s-detail').innerHTML='<div class=\"mapph\"><\/div><div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:8px\"><h3 style=\"font-size:18px\">'+l.name+'<\/h3><span class=\"chip '+chipc(l.conf)+'\">'+lblc(l.conf)+' · '+l.conf+'<\/span><\/div>'\n    +meter(l.conf)+'<p style=\"font-size:13px;color:var(--ink2);margin-bottom:8px\">'+cap+'<\/p>'\n    +'<div class=\"kv\"><span>Price<\/span><b>₹'+l.rate+'/hr · '+cost(l)+' total<\/b><\/div><div class=\"kv\"><span>Your window<\/span><b>'+$('t1').value+'–'+$('t2').value+'<\/b><\/div><div class=\"kv\"><span>Rules<\/span><b>'+l.rules+'<\/b><\/div>'\n    +'<div class=\"ev\"><h5>Why we think it\\'s free<\/h5>'+ev+'<\/div>'\n    +(vanBlock?'<div class=\"banner bad\"><span>✕<\/span><span>Your vehicle doesn\\'t fit this space’s rules.<\/span><\/div><button class=\"btn full\" disabled>Save this spot for 10 minutes<\/button>':\n      (l.conf<55?'<div class=\"banner hold\"><span>!<\/span><span>Lower confidence. We\\'ll line up a backup if this hold fails.<\/span><\/div>':'')+'<button class=\"btn amber full\" id=\"holdBtn\">Save this spot for 10 minutes<\/button><p style=\"font-size:12px;color:var(--ink2);text-align:center;margin-top:8px\">You have not confirmed the booking yet.<\/p>');\n    var hb=$('holdBtn');if(hb)hb.onclick=requestHold;\n  }\n\n  /* hold */\n  function requestHold(){\n    log('Driver requested hold on '+S.cur.name,'u');step(4);\n    $('holdChecking').style.display='block';$('holdActive').style.display='none';$('holdExpired').style.display='none';\n    go('hold');chip('Checking','c-info',true);\n    setTimeout(function(){step(5);log('Booking system: checking overlaps for '+S.cur.id+' '+$('t1').value+'–'+$('t2').value,'s');},300);\n    setTimeout(function(){\n      if(S.scn==='conflict'){\n        log('Conflict: overlapping hold from another driver','e');\n        chip('Conflict','c-rescue');toast('Someone got there first.');\n        setTimeout(function(){openRescue('conflict')},1100);return;\n      }\n      log('No conflict. Hold created, expires in '+(S.scn==='expiry'?'0:10':'2:00'),'g');\n      startHold();\n    },1500);\n  }\n  function startHold(){\n    S.total=S.scn==='expiry'?10:120;S.left=S.total;\n    $('holdChecking').style.display='none';$('holdActive').style.display='block';\n    $('holdSum').innerHTML='<div class=\"kv\"><span>Space<\/span><b>'+S.cur.name+'<\/b><\/div><div class=\"kv\"><span>Window<\/span><b>'+$('t1').value+'–'+$('t2').value+'<\/b><\/div><div class=\"kv\"><span>Total<\/span><b>'+cost(S.cur)+'<\/b><\/div>';\n    chip('On hold','c-hold',true);step(6);tick();\n    clearInterval(S.timer);S.timer=setInterval(function(){S.left--;tick();if(S.left<=0){clearInterval(S.timer);expire()}},1000);\n  }\n  function tick(){\n    var m=Math.floor(S.left/60),s=S.left%60;\n    var c=$('clk');c.textContent=('0'+m).slice(-2)+':'+('0'+s).slice(-2);c.className='big'+(S.left<=60&&S.total>60||S.left<=5?' low':'');\n    $('clkBar').style.width=(S.left/S.total*100)+'%';\n  }\n  function expire(){\n    log('Hold expired. Confirm disabled.','e');\n    $('holdActive').style.display='none';$('holdExpired').style.display='block';chip('Expired','c-grey');\n  }\n  $('confirmBtn').onclick=function(){\n    clearInterval(S.timer);log('Driver confirmed before expiry','u');\n    $('confirmBtn').disabled=true;\n    setTimeout(function(){log('Booking system: hold converted to booking','g');showBooked(false)},700);\n  };\n  $('releaseBtn').onclick=function(){clearInterval(S.timer);log('Driver released the hold','u');toast('Hold released.');renderResults();go('results');step(2)};\n  $('expRescue').onclick=function(){openRescue('expired')};\n  $('expRetry').onclick=function(){log('Driver retried same space','u');$('confirmBtn').disabled=false;requestHold()};\n\n  function showBooked(rescued){\n    S.rescued=rescued;$('confirmBtn').disabled=false;\n    var ref='SS-'+Math.floor(1000+Math.random()*9000);$('bkRef').textContent=ref;\n    $('bkBanner').innerHTML=rescued?'<span>✓<\/span><span><b>Rescued and reserved.<\/b> This replaces your original space.<\/span>':'<span>✓<\/span><span><b>Confirmed.<\/b> Show this reference at the gate.<\/span>';\n    $('bkSum').innerHTML='<div class=\"kv\"><span>Space<\/span><b>'+S.cur.name+'<\/b><\/div><div class=\"kv\"><span>Window<\/span><b>'+$('t1').value+'–'+$('t2').value+'<\/b><\/div><div class=\"kv\"><span>Rules<\/span><b>'+S.cur.rules+'<\/b><\/div><div class=\"kv\"><span>Total<\/span><b>'+cost(S.cur)+'<\/b><\/div>';\n    $('cancelBanner').style.display='none';$('bkBanner').style.display='flex';\n    go('booked');chip(rescued?'Rescued':'Confirmed','c-ok');step(rescued?8:6);\n    log('Status: '+(rescued?'rescued':'confirmed')+' · ref '+ref,'g');\n    if(S.scn==='cancel'&&!rescued){\n      setTimeout(function(){\n        if(!$('s-booked').classList.contains('on'))return;\n        log('Provider cancelled the window → rescue trigger: provider_cancelled','e');\n        $('bkBanner').style.display='none';$('cancelBanner').style.display='flex';chip('Cancelled','c-rescue');toast('Provider cancelled. Alternatives are ready.');\n      },4000);\n    }\n  }\n  $('cancelRescue').onclick=function(){openRescue('cancel')};\n  $('newSearch').onclick=function(){go('search');step(2)};\n\n  /* rescue */\n  var reasons={conflict:'Someone else got this space first.',expired:'Your hold ended before it was confirmed.',cancel:'The provider can no longer offer this space.'};\n  function openRescue(r){\n    clearInterval(S.timer);S.reason=r;step(7);\n    log('Rescue Engine triggered: '+({conflict:'hold_conflict',expired:'hold_expired',cancel:'provider_cancelled'})[r],'e');\n    $('resSearching').style.display='block';$('resList').style.display='none';\n    go('rescue');chip('Finding','c-rescue',true);\n    setTimeout(function(){\n      var alts=L.filter(function(x){return x.id!==S.cur.id}).sort(function(a,b){return Math.abs(a.km-S.cur.km)-Math.abs(b.km-S.cur.km)}).slice(0,3);\n      log('Rescue Engine: '+alts.length+' alternatives ranked by closeness × confidence','s');\n      renderAlts(alts);\n    },1400);\n  }\n  var lastAlts=[];\n  function renderAlts(alts){\n    lastAlts=alts;\n    var h='<div class=\"banner bad\"><span>↯<\/span><span><b>'+reasons[S.reason]+'<\/b> Here are the closest matches.<\/span><\/div>';\n    alts.forEach(function(a){\n      var dk=(a.km-S.cur.km),dp=a.rate-S.cur.rate;\n      h+='<div class=\"lcard\" style=\"cursor:default\"><div class=\"t\"><b>'+a.name+'<\/b><span class=\"chip '+chipc(a.conf)+'\">'+lblc(a.conf)+'<\/span><\/div>'+meter(a.conf)\n      +'<div class=\"delta\"><span>'+(dk>=0?'+':'')+dk.toFixed(1)+' km<\/span><span>'+(dp===0?'same price':(dp<0?'₹'+(-dp)+'/hr cheaper':'₹'+dp+'/hr more'))+'<\/span><span>'+a.rules.split(' · ')[0]+'<\/span><\/div>'\n const frame = document.getElementById('site');
function showPage(name){ frame.srcdoc = pages[name] || pages.index; }
frame.addEventListener('load', () => {
  try {
    const doc = frame.contentDocument;

      const a = event.target.closest && event.target.closest('a[href]');
      if (!a) return;
      const href = a.getAttribute('href') || '';
      const match = href.match(/(?:^|\/)(index|login|consumer|provider)\.html(?:$|[?#])/i);
      if (match) {
        event.preventDefault();
        showPage(match[1].toLowerCase());
      }
    }, true);
  } catch (e) {}
});
