<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173d32">
<title>ParkMate | Welcome</title>
<style>
:root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#edf3e9,#f8f5ed);color:#173d32}
main{width:min(92vw,760px);padding:56px 28px;text-align:center;background:#fffefa;border:1px solid #dce5d9;border-radius:24px;box-shadow:0 22px 70px #173d3218}
.logo{display:inline-grid;place-items:center;width:68px;height:68px;border-radius:20px;background:#173d32;color:#fff;font-size:30px;font-weight:800}
h1{margin:22px 0 10px;font-size:clamp(38px,7vw,64px);letter-spacing:-.05em}
p{max-width:540px;margin:0 auto;color:#637369;font-size:17px;line-height:1.7}
a{display:inline-flex;align-items:center;justify-content:center;margin-top:30px;padding:15px 28px;border-radius:999px;background:#173d32;color:white;text-decoration:none;font-weight:700}
a:hover{background:#285b49}small{display:block;margin-top:22px;color:#829087}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">P</div>
  <h1>Welcome to ParkMate</h1>
  <p>Find convenient parking or make your unused parking space work for you.</p>
  <a href="landing-page.html">Explore ParkMate <span aria-hidden="true">&nbsp;→</span></a>
  <small>Find a spot. Park with ease.</small>
</main>
</body>
</html>
